version: '3.4'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 3s
      timeout: 3s
      retries: 15

  dormapiwebapp:
    image: dormapiwebapp:latest
    build:
      context: .
      dockerfile: DormAPIWebApp/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=DormDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development